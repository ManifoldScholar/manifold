# When `beta` branch merges into `main`, create a release candidate.

name: Promote beta to release candidate

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main

jobs:
  promote:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'beta'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve versions
        id: versions
        run: |
          current="$(tr -d '[:space:]' < MANIFOLD_VERSION)"
          base="${current%%-*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not derive a base version from MANIFOLD_VERSION '$current'"
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "target=${base}-rc.1" >> "$GITHUB_OUTPUT"

      - name: Push promotion commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "chore: promote ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.target }}" \
            -m "Release-As: ${{ steps.versions.outputs.target }}"
          git push origin main

      - name: Rewrite release PR to the RC base
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ".release-please/main-config.json"
          manifest-file: ".release-please/main-manifest.json"
