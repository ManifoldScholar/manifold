name: "Build & Push Docker"

on:
  workflow_call:
    inputs:
      channel_tags:
        description: "Space-separated channel tags to publish (e.g. 'beta preview' or 'latest')"
        required: true
        type: string
      semver:
        description: "Full semver to tag the image with (e.g. 9.2.3-rc.1); omit for HEAD builds"
        required: false
        default: ""
        type: string

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - id: tags
        run: |
          {
            echo 'tags<<TAGS_EOF'
            for channel in ${{ inputs.channel_tags }}; do
              echo "type=raw,value=$channel"
            done
            if [[ -n "${{ inputs.semver }}" ]]; then
              echo "type=raw,value=${{ inputs.semver }}"
            fi
            echo "type=sha"
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

  build-api:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-api
          tags: ${{ needs.prep.outputs.tags }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args:
            "RAILS_ENV=production"

  build-client:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-client
          tags: ${{ needs.prep.outputs.tags }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Docker
        id: push
        uses: docker/build-push-action@v5
        with:
          context: ./client
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args:
            "RAILS_ENV=production"
