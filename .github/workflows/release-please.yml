on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  reset-release-branch:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset release branch to main
        run: git push origin ${{ github.sha }}:refs/heads/release --force
      - name: Trigger Docker build on release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker.yml --ref release

  update-manifold-version:
    needs: release-please
    # Run on stable releases only; prerelease versions (e.g. 10.0.0-rc.1, 9.3.0-beta.2) contain a hyphen
    if: ${{ needs.release-please.outputs.release_created == 'true' && !contains(needs.release-please.outputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Manifold version update in related repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh workflow run update-manifold-version.yml
          --repo "${{ github.repository }}"
          -f version="${{ needs.release-please.outputs.version }}"
