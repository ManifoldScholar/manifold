name: release-please

on:
  push:
    branches:
      - beta
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - if: github.ref_name == 'beta'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Beta will be regularly rebased on main, defeating release-please's SHA lookups for changelogs.
      # This goes back and looks for the latest merged release PR on the branch and bases the changelog off of that
      - name: Re-anchor beta release after rebase
        if: github.ref_name == 'beta'
        run: |
          set -euo pipefail

          version="$(jq -r '.["."]' .release-please/beta-manifest.json)"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "No beta version in manifest; nothing to re-anchor."
            exit 0
          fi

          if ! git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} does not exist yet; release-please will bootstrap."
            exit 0
          fi

          anchor="$(git rev-list -n1 "refs/tags/${version}")"
          if git merge-base --is-ancestor "$anchor" HEAD; then
            echo "Anchor ${anchor} for ${version} is reachable; no re-anchor needed."
            exit 0
          fi

          echo "Anchor ${anchor} for ${version} unreachable (branch was rebased); relocating."
          rebased="$(git log HEAD --grep "^chore(beta): release ${version}$" --format=%H -n1 || true)"
          if [[ -z "$rebased" ]]; then
            echo "::warning::No rebased 'chore(beta): release ${version}' commit found; leaving tag unchanged. release-please may regenerate the full changelog."
            exit 0
          fi

          echo "Re-pointing tag ${version}: ${anchor} -> ${rebased}"
          git tag -f "$version" "$rebased"
          git push -f origin "refs/tags/${version}"

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'main' && '.release-please/main-config.json' || '.release-please/beta-config.json' }}
          manifest-file: ${{ github.ref_name == 'main' && '.release-please/main-manifest.json' || '.release-please/beta-manifest.json' }}

  plan:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      channel_tags: ${{ steps.plan.outputs.channel_tags }}
      semver: ${{ steps.plan.outputs.semver }}
    steps:
      - name: Plan build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RELEASE_CREATED: ${{ needs.release.outputs.release_created }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          build=false
          channel_tags=""
          semver=""

          if [[ "$BRANCH" == "beta" ]]; then
            if [[ "$RELEASE_CREATED" == "true" ]]; then
              build=true
              semver="$TAG"
              case "$TAG" in
                *-rc*) channel_tags="beta preview" ;;
                *)     channel_tags="beta" ;;
              esac
            fi
          else
            # RC mode is the committed prerelease-type on the beta branch.
            beta_type="$(gh api "repos/$REPO/contents/.release-please/beta-config.json?ref=beta" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null \
              | jq -r '.packages["."]["prerelease-type"] // empty')"

            if [[ "$beta_type" == "rc" ]]; then
              if [[ "$RELEASE_CREATED" == "true" ]]; then
                build=true
                channel_tags="latest"
                semver="$TAG"
              fi
            else
              # Outside RC mode preview tracks main HEAD, so every push builds it.
              build=true
              if [[ "$RELEASE_CREATED" == "true" ]]; then
                channel_tags="latest preview"
                semver="$TAG"
              else
                channel_tags="preview"
              fi
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "channel_tags=$channel_tags" >> "$GITHUB_OUTPUT"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "Plan: branch=$BRANCH release=$RELEASE_CREATED build=$build tags='$channel_tags' semver='$semver'"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel_tags: ${{ needs.plan.outputs.channel_tags }}
      semver: ${{ needs.plan.outputs.semver }}
    secrets: inherit
