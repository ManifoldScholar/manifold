name: release-please

on:
  push:
    branches:
      - beta
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref_name }}

jobs:
  beta:
    if: github.ref_name == 'beta'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ".release-please/beta-config.json"
          manifest-file: ".release-please/beta-manifest.json"

  main:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ".release-please/main-config.json"
          manifest-file: ".release-please/main-manifest.json"

  build-beta:
    needs: beta
    if: needs.beta.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel_tag: beta
      semver: ${{ needs.beta.outputs.tag_name }}
    secrets: inherit

  build-main:
    needs: main
    if: needs.main.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel_tag: ${{ contains(needs.main.outputs.tag_name, '-') && 'preview' || 'latest' }}
      semver: ${{ needs.main.outputs.tag_name }}
    secrets: inherit
