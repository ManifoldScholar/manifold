name: release-please

on:
  pull_request_target:
    types: [closed]
    branches:
      - beta
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref_name }}

jobs:
  beta:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'beta'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: beta
          config-file: ".release-please/beta-config.json"
          manifest-file: ".release-please/beta-manifest.json"

  main:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A beta merge resets the prerelease line to rc.1 off the merged base version;
      # all other merges let release-please compute the version normally.
      - name: Checkout main
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'beta'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve rc target
        id: versions
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'beta'
        run: |
          current="$(tr -d '[:space:]' < MANIFOLD_VERSION)"
          base="${current%%-*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::could not derive a base version from MANIFOLD_VERSION '$current'"
            exit 1
          fi
          echo "target=${base}-rc.1" >> "$GITHUB_OUTPUT"

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: ".release-please/main-config.json"
          manifest-file: ".release-please/main-manifest.json"
          release-as: ${{ steps.versions.outputs.target }}

  build-beta:
    needs: beta
    if: needs.beta.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel_tag: beta
      semver: ${{ needs.beta.outputs.tag_name }}
    secrets: inherit

  build-main:
    needs: main
    if: needs.main.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      channel_tag: ${{ contains(needs.main.outputs.tag_name, '-') && 'preview' || 'latest' }}
      semver: ${{ needs.main.outputs.tag_name }}
    secrets: inherit

  update-manifold-version:
    needs: main
    # Run on stable releases only; prerelease versions (e.g. 10.0.0-rc.1, 9.3.0-beta.2) contain a hyphen
    if: ${{ needs.main.outputs.release_created == 'true' && !contains(needs.main.outputs.version, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Manifold version update in related repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh workflow run update-manifold-version.yml
          --repo "${{ github.repository }}"
          -f version="${{ needs.main.outputs.version }}"
